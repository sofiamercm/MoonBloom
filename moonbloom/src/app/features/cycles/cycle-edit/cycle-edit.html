<div class="dashboard-wrapper">
  <div class="card-back">
    <div class="blob-orange"></div>
  </div>

  <div class="dashboard-front">

    <div class="dashboard-header" style="margin-bottom: 20px;">
      <div>
        <p class="dashboard-label" style="font-size: 13px; color: #9a9590; margin: 0 0 12px;">Moonbloom</p>
        <h1 class="dashboard-title">
          Edit cycle
          <span class="wave">✦</span>
        </h1>
        <p class="dashboard-subtitle">Update the information of your cycle</p>
      </div>
      <a routerLink="/calendario" class="btn-soft">Back to calendar</a>
    </div>

    <div class="glass-card">

      <div *ngIf="error" class="alert-danger">{{ error }}</div>

      <div *ngIf="loading" style="padding: 40px; text-align: center; color: #9a9590;">
        Loading cycle...
      </div>

      <form (ngSubmit)="onSubmit()" *ngIf="!loading && !error">

        <div style="margin-bottom: 24px;">
          <label for="startDate" class="form-label">Start date</label>
          <input type="date" id="startDate" name="startDate" [(ngModel)]="cycle.startDate" class="form-control" required />
        </div>

        <div style="margin-bottom: 24px;">
          <label for="endDate" class="form-label">
            End date
            <span style="color: #9a9590; font-weight: 300; font-size: 12px; margin-left: 5px;">(optional)</span>
          </label>
          <input type="date" id="endDate" name="endDate" [(ngModel)]="cycle.endDate" class="form-control" />
        </div>

        <div style="margin-bottom: 24px;">
          <label for="durationDays" class="form-label">
            Duration
            <span style="color: #9a9590; font-weight: 300; font-size: 12px; margin-left: 5px;">(days, optional)</span>
          </label>
          <input type="number" id="durationDays" name="durationDays" [(ngModel)]="cycle.durationDays"
            class="form-control" placeholder="e.g. 28" min="1" max="90" />
        </div>

        <div style="margin-bottom: 32px;">
          <label for="notes" class="form-label">Notes</label>
          <textarea id="notes" name="notes" [(ngModel)]="cycle.notes" class="form-control" rows="3"
            placeholder="General observations about this cycle"></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end;">
          <button type="submit" class="btn-primary-pill" style="padding: 16px 40px; font-size: 16px;">
            Save changes
          </button>
        </div>

      </form>

    </div>

  </div>
</div>
