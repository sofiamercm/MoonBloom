<div class="form-wrapper">
  <div class="form-inner">
    <section class="form-header">
      <div>
        <p class="form-label-top">Moonbloom</p>
        <h1 class="form-title">New Cycle ✨</h1>
        <p class="form-subtitle">Log a new menstrual cycle and keep your calendar in rhythm.</p>
      </div>

      <a routerLink="/calendario" class="btn-soft">Back to calendar</a>
    </section>

    <section class="form-panel">
      <div *ngIf="error" class="alert alert--error">
        {{ error }}
      </div>

      <form (ngSubmit)="onSubmit()" class="entry-form">
        <div class="field-grid">
          <div class="field-group">
            <label for="startDate">Start Date</label>
            <input type="date" id="startDate" name="startDate" [(ngModel)]="cycle.startDate" required />
          </div>

          <div class="field-group">
            <label for="endDate">End Date <span>optional</span></label>
            <input type="date" id="endDate" name="endDate" [(ngModel)]="cycle.endDate" />
          </div>
        </div>

        <div class="field-group">
          <label for="durationDays">Duration <span>days, optional</span></label>
          <input
            type="number"
            id="durationDays"
            name="durationDays"
            [(ngModel)]="cycle.durationDays"
            placeholder="Ex: 28"
            min="1"
            max="90"
          />
        </div>

        <div class="field-group">
          <label for="notes">Notes</label>
          <textarea
            id="notes"
            name="notes"
            [(ngModel)]="cycle.notes"
            rows="4"
            placeholder="General observations about your cycle"
          ></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary-pill">Create cycle</button>
        </div>
      </form>
    </section>
  </div>
</div>
