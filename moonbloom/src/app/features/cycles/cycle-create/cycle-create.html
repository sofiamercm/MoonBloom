<div class="dashboard-wrapper">
  <!-- Decorative background -->
  <div class="card-back">
    <div class="blob-orange"></div>
  </div>

  <div class="dashboard-front">

    <div class="glass-card">
      <div class="dashboard-header" style="margin-bottom: 20px;">
        <div>
          <p class="dashboard-label" style="font-size: 13px; color: #9a9590; margin: 0 0 12px;">Moonbloom</p>
          <h1 class="dashboard-title">
            New Cycle
            <span class="wave">✨</span>
          </h1>
          <p class="dashboard-subtitle">
            Log a new menstrual cycle
          </p>
        </div>

        <div>
          <a routerLink="/calendario" class="btn-soft">
            Back to Calendar
          </a>
        </div>
      </div>

      <div *ngIf="error" class="alert-danger">
        {{error}}
      </div>

      <form (ngSubmit)="onSubmit()">

        <!-- Start date -->
        <div style="margin-bottom: 24px;">
          <label for="startDate" class="form-label">Start Date</label>
          <input type="date" id="startDate" name="startDate" [(ngModel)]="cycle.startDate" class="form-control" required />
        </div>

        <!-- End date (optional) -->
        <div style="margin-bottom: 24px;">
          <label for="endDate" class="form-label">
            End Date
            <span style="color: #9a9590; font-weight: 300; font-size: 12px; margin-left: 5px;">
              (optional — you can add it later)
            </span>
          </label>
          <input type="date" id="endDate" name="endDate" [(ngModel)]="cycle.endDate" class="form-control" />
        </div>

        <!-- Duration in days (optional) -->
        <div style="margin-bottom: 24px;">
          <label for="durationDays" class="form-label">
            Duration
            <span style="color: #9a9590; font-weight: 300; font-size: 12px; margin-left: 5px;">
              (days, optional)
            </span>
          </label>
          <input 
            type="number"
            id="durationDays"
            name="durationDays"
            [(ngModel)]="cycle.durationDays"
            class="form-control"
            placeholder="Ex: 28"
            min="1"
            max="90" />
        </div>

        <!-- Notes -->
        <div style="margin-bottom: 32px;">
          <label for="notes" class="form-label">Notes</label>
          <textarea
            id="notes"
            name="notes"
            [(ngModel)]="cycle.notes"
            class="form-control"
            rows="3"
            placeholder="General observations about your cycle">
          </textarea>
        </div>

        <div style="display: flex; justify-content: flex-end;">
          <button type="submit" class="btn-primary-pill" style="padding: 16px 40px; font-size: 16px;">
            Create Cycle
          </button>
        </div>

      </form>
    </div>

  </div>
</div>
