<div class="login-wrapper">

  <!-- Tarjeta de fondo (decorativa) -->
  <div class="card-back">
    <div class="blob-orange"></div>
  </div>

  <!-- Tarjeta principal (glassmorphism encima) -->
  <div class="card-front">

    <div class="card-header">
      <span class="brand" routerLink="/" style="cursor:pointer">Moonbloom</span>
      <span class="sign-up-link" routerLink="/register" style="cursor:pointer">Sign up</span>
    </div>

    <h2 class="card-title">Log in</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">

      <!-- EMAIL -->
      <div class="field-wrap" [class.field-error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        <div class="field-pill">
          <span class="field-icon">@</span>
          <input
            type="email"
            placeholder="e-mail address"
            formControlName="email"
          />
        </div>
        <small class="error-msg"
          *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Invalid email
        </small>
      </div>

      <!-- PASSWORD -->
      <div class="field-wrap" [class.field-error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        <div class="field-pill">
          <span class="field-icon">&#128273;</span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            placeholder="password"
            formControlName="password"
          />
          <button type="button" class="eye-btn" title="Show/Hide password" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <small class="error-msg"
          *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Please use at least 6 characters
        </small>
      </div>

      <!-- ERROR GENERAL -->
      <div *ngIf="errorMessage" class="alert-error">
        {{ errorMessage }}
      </div>

      <!-- SUBMIT -->
      <div class="submit-row">
        <p class="disclaimer">
          The body keeps its own calendar.
          <br>
          Log in to view yours.
        </p>
        <button type="submit" class="blob-btn" [disabled]="isLoading" aria-label="Login">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>

    </form>

    <div class="google-login-separator">
      <hr>
      <span>Or continue with</span>
    </div>

    <button type="button" (click)="loginWithGoogle()" class="google-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" class="me-2">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

  </div>
</div>
