<div class="container mt-5">

  <div class="row justify-content-center">

    <div class="col-md-5">

      <div class="card shadow p-4">

        <h2 class="text-center mb-4">
          Create Account 🌸
        </h2>

        <form>

          <div class="mb-3">
            <label>Name</label>

            <input
              type="text"
              class="form-control"
              placeholder="Enter your name"
            >
          </div>

          <div class="mb-3">
            <label>Email</label>

            <input
              type="email"
              class="form-control"
              placeholder="Enter your email"
            >
          </div>

          <div class="mb-4">
            <label>Password</label>

            <input
              type="password"
              class="form-control"
              placeholder="Create a password"
            >
          </div>

          <button class="btn btn-dark w-100">
            Register
          </button>

        </form>

      </div>

    </div>

  </div>

</div>
