<div class="form-wrapper">
  <div class="form-inner">
    <section class="form-header">
      <div>
        <p class="form-label-top">Moonbloom</p>
        <h1 class="form-title">New Daily Log 🌙</h1>
        <p class="form-subtitle">Capture how your body and mood feel today.</p>
      </div>

      <a routerLink="/daily-logs" class="btn-soft">Back to daily logs</a>
    </section>

    <section class="form-panel">
      <div *ngIf="error" class="alert alert--error">{{ error }}</div>

      <div *ngIf="loading" class="state-card">
        Loading...
      </div>

      <form (ngSubmit)="onSubmit()" *ngIf="!loading" class="entry-form">
        <div class="field-group">
          <label for="cycleId">Associated cycle</label>
          <ng-container *ngIf="cycles.length > 0; else noCycles">
            <select id="cycleId" name="cycleId" [(ngModel)]="log.cycleId" required>
              <option value="">Select a cycle...</option>
              <option *ngFor="let cycle of cycles" [value]="cycle._id">
                Start: {{ cycle.startDate | date:'mediumDate' }}
              </option>
            </select>
          </ng-container>

          <ng-template #noCycles>
            <div class="alert alert--warning">
              No cycles registered yet.
              <a routerLink="/ciclos/nuevo">Create one first</a>.
            </div>
          </ng-template>
        </div>

        <div class="field-grid">
          <div class="field-group">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" [(ngModel)]="log.date" required />
          </div>

          <div class="field-group">
            <label for="mood">Mood</label>
            <select id="mood" name="mood" [(ngModel)]="log.mood">
              <option value="">Select...</option>
              <option value="feliz">😊 Happy</option>
              <option value="tranquila">😌 Calm</option>
              <option value="triste">😔 Sad</option>
              <option value="enojada">😤 Angry</option>
              <option value="cansada">😴 Tired</option>
              <option value="ansiosa">😰 Anxious</option>
              <option value="sensible">🥺 Sensitive</option>
              <option value="normal">😐 Neutral</option>
            </select>
          </div>
        </div>

        <div class="field-group">
          <label>Flow intensity <span>1 = very light, 5 = very heavy</span></label>
          <div class="flow-radio-group">
            <input type="radio" name="flow" id="flow1" value="1" [(ngModel)]="log.flow" /><label for="flow1">1</label>
            <input type="radio" name="flow" id="flow2" value="2" [(ngModel)]="log.flow" /><label for="flow2">2</label>
            <input type="radio" name="flow" id="flow3" value="3" [(ngModel)]="log.flow" /><label for="flow3">3</label>
            <input type="radio" name="flow" id="flow4" value="4" [(ngModel)]="log.flow" /><label for="flow4">4</label>
            <input type="radio" name="flow" id="flow5" value="5" [(ngModel)]="log.flow" /><label for="flow5">5</label>
          </div>
        </div>

        <div class="field-group">
          <label for="symptoms">Symptoms <span>comma separated</span></label>
          <input
            type="text"
            id="symptoms"
            name="symptoms"
            [(ngModel)]="log.symptoms"
            placeholder="e.g. cramps, headache, fatigue"
          />
        </div>

        <div class="field-group">
          <label for="notes">Notes</label>
          <textarea
            id="notes"
            name="notes"
            [(ngModel)]="log.notes"
            rows="4"
            placeholder="How was your day?"
          ></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary-pill">Save log</button>
        </div>
      </form>
    </section>
  </div>
</div>
